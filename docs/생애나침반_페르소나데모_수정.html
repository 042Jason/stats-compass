<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생애나침반 — 페르소나 시연 데모</title>
<style>
  :root{
    --ink:#1f2933; --sub:#6b7684; --line:#e2e6ea; --bg:#fff;
    --brand:#1a5276; --brand2:#2c6fa8; --soft:#eef4f9;
    --warn:#c0392b; --warnbg:#fdf4f3; --ok:#1e8449;
    --kosis:#0b6e4f; --kosisbg:#eef7f2;
    --code:#182028;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#eef0f3; color:var(--ink); line-height:1.7; font-size:15px;
    font-family:"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  .mono{font-family:"Consolas","D2Coding","Menlo",monospace;}
  .app{max-width:980px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px rgba(0,0,0,.05);}

  header{background:var(--brand);color:#fff;padding:16px 20px;}
  header .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;font-weight:800;}
  header .tag{font-size:11px;background:rgba(255,255,255,.18);border-radius:4px;padding:2px 8px;}
  header p{margin:6px 0 0;font-size:13px;opacity:.9;}

  /* 5단계 요건 표시 */
  .pipe{display:flex;background:#f7f9fb;border-bottom:1px solid var(--line);overflow-x:auto;}
  .pipe .p{flex:1 0 auto;min-width:132px;padding:9px 12px;font-size:11px;color:#8a94a0;
           border-right:1px solid var(--line);white-space:nowrap;}
  .pipe .p:last-child{border-right:none;}
  .pipe .p b{display:block;font-size:12.5px;color:#5b6670;font-weight:700;}
  .pipe .p.on{background:var(--soft);color:var(--brand2);}
  .pipe .p.on b{color:var(--brand);}
  .pipe .p.done{color:#9aa5b1;}
  .pipe .p.done b{color:#7b8794;}
  .pipe .p.done::after{content:" ✓";color:var(--ok);font-weight:700;}

  /* GraphRAG */
  .gwrap{border-bottom:1px solid var(--line);background:#fbfcfd;overflow-x:auto;}
  .ghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 20px 0;}
  .ghead .gt{font-size:12px;font-weight:800;color:var(--brand);}
  .ghead .gc{font-size:12px;color:var(--sub);}
  .graph{position:relative;height:410px;margin:6px 12px 14px;min-width:1210px;}
  .graph canvas{position:absolute;inset:0;width:100%;height:100%;}
  .gnode{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1.5px solid #cfd8e0;
    border-radius:7px;padding:3px 7px;font-size:10.5px;line-height:1.3;white-space:nowrap;color:#8a94a0;
    opacity:.32;transition:opacity .45s,border-color .45s,color .45s,box-shadow .45s,transform .45s;}
  .gnode .gk{display:block;font-size:9px;opacity:.85;font-weight:600;}
  .gnode .gl{display:block;font-weight:700;}
  .gnode.lit{opacity:1;color:var(--ink);box-shadow:0 1px 5px rgba(26,82,118,.14);}
  .gnode.pp.lit{border-color:#7fb3d5;background:#f4f9fd;}
  .gnode.ls.lit{border-color:#8fc7dc;background:#f1f9fc;}
  .gnode.ind.lit{border-color:#d8b6d8;background:#fbf4fb;}
  .gnode.al.lit{border-color:#e8a87c;background:#fdf6f0;}      /* 유의어(hiddenLabel) */
  .gnode.cc.lit{border-color:#e8a0bf;background:#fdf2f7;}      /* 통계용어 */
  .gnode.tk.lit{border-color:#9aa5b1;background:#f4f6f8;}      /* 입력 조각 */
  .gnode.sv.lit{border-color:var(--brand2);background:var(--soft);color:var(--brand);}
  .gnode.tb.lit{border-color:#9fc9b5;background:var(--kosisbg);color:var(--kosis);}
  .gnode.hot{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 2px 12px rgba(26,82,118,.26);}
  /* 후보로 떠올랐다가 걸러진 노드. 지워지지 않고 '왜 빠졌는지'가 남습니다 */
  .gnode.dropped{opacity:.55!important;border-color:#dcc3bf!important;background:#fdf7f6!important;
    color:#9a7a75!important;box-shadow:none!important;transform:translate(-50%,-50%) scale(.94);}
  .gnode.dropped .gl{text-decoration:line-through;text-decoration-color:#c0392b;}
  .gnode .why{display:block;font-size:8.5px;color:#c0392b;font-weight:700;margin-top:1px;opacity:0;
    transition:opacity .5s;}
  .gnode.dropped .why{opacity:1;}
  .gnode .sc{font-family:"Consolas","D2Coding",monospace;font-size:8.5px;color:var(--brand2);
    margin-left:4px;opacity:0;transition:opacity .5s;}
  .gnode.lit .sc{opacity:.8;}
  .gnode.dropped .sc{color:#b08b86;}
  .gcol{position:absolute;top:-2px;transform:translateX(-50%);font-size:9.5px;font-weight:800;
        color:#a4aeb8;letter-spacing:.03em;white-space:nowrap;}
  /* 이 질문에 쓰이지 않은 노드. 켜지지 않는다는 것 자체가 보여야 합니다 */
  .bgn{position:absolute;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;
       background:#c9d2da;opacity:.5;transition:opacity .6s;}
  .gwrap.narrow .bgn{opacity:.22;}
  .gcount{position:absolute;right:4px;bottom:2px;font-size:11px;color:var(--sub);
          font-family:"Consolas","D2Coding",monospace;background:rgba(251,252,253,.9);padding:2px 6px;border-radius:4px;}
  .gcount b{color:var(--brand);}

  .stream{padding:18px 20px 8px;min-height:300px;}
  .blk{margin:0 0 16px;animation:in .28s ease-out both;}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .who{font-size:11px;letter-spacing:.05em;font-weight:800;color:var(--sub);margin:0 0 5px;}
  .msg-ai{border-left:3px solid var(--brand2);padding:2px 0 2px 14px;}
  .msg-ai p{margin:6px 0;} .msg-ai ul{margin:6px 0;padding-left:20px;} .msg-ai li{margin:3px 0;}
  .think{color:var(--sub);font-size:13px;}
  .think .dots::after{content:"···";letter-spacing:2px;animation:blink 1.1s steps(4) infinite;}
  @keyframes blink{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}

  /* 자유 입력 */
  .qbox{display:flex;gap:8px;align-items:stretch;}
  .qinput{flex:1;border:1.5px solid var(--brand2);border-radius:8px;padding:12px 14px;
    font-size:15.5px;background:#fff;line-height:1.4;}
  .qbtn{background:var(--brand);color:#fff;border-radius:8px;padding:12px 18px;font-size:14px;
    white-space:nowrap;font-weight:700;display:flex;align-items:center;}
  .qhint{font-size:11.5px;color:var(--sub);margin:6px 0 0;}

  /* 추출 결과 칩 */
  .slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .slot{border:1px solid var(--line);border-radius:7px;padding:6px 11px;background:#fff;}
  .slot span{display:block;font-size:10px;color:var(--sub);font-weight:700;}
  .slot b{font-size:15px;}
  .slot.miss{border-style:dashed;background:#fbfcfd;}
  .slot.miss b{color:#a4aeb8;font-weight:600;}

  /* 페르소나 카드 */
  .persona{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#f2f5f8;
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .persona .av{width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex:0 0 52px;}
  .persona .f{display:flex;gap:18px;flex-wrap:wrap;}
  .persona .f div span{display:block;font-size:10.5px;color:var(--sub);font-weight:700;}
  .persona .f div b{font-size:16px;}

  /* 도구 카드 */
  .tool{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:10px 0;}
  .tool .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
    background:#f7f9fb;border-bottom:1px solid var(--line);font-size:12.5px;}
  .badge{font-size:10.5px;font-weight:800;border-radius:4px;padding:2px 7px;}
  .badge.compass{background:var(--soft);color:var(--brand);}
  .badge.kosis{background:var(--kosisbg);color:var(--kosis);}
  .tool .th .fn{font-family:"Consolas","D2Coding",monospace;font-weight:700;color:#37474f;}
  .tool .th .role{color:var(--sub);margin-left:auto;font-size:11.5px;}
  pre{margin:0;padding:11px 12px;background:var(--code);color:#d7e3ee;overflow-x:auto;
    font-family:"Consolas","D2Coding",monospace;font-size:12px;line-height:1.6;white-space:pre;}
  pre .k{color:#f0c674;} pre .s{color:#9fd8a0;} pre .n{color:#8fd3e8;}
  .tool .sep{padding:6px 12px;font-size:11px;font-weight:800;color:var(--sub);background:#fbfcfd;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .tool .rendered{padding:11px 12px;background:#fff;}
  .pending{padding:11px 12px;color:var(--sub);font-size:13px;background:#fbfcfd;}

  .hit{border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin:7px 0;background:#fff;}
  .hit .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;}
  .hit .nm{font-weight:700;color:#c2185b;font-size:14.5px;}
  .hit .sc{font-size:11px;color:var(--sub);background:#fdf2f7;border-radius:3px;padding:1px 7px;}
  .tid{display:inline-block;background:#e7eff6;color:var(--brand);border-radius:4px;padding:1px 7px;
    font-family:"Consolas","D2Coding",monospace;font-size:11px;font-weight:700;}
  .tid.k{background:var(--kosisbg);color:var(--kosis);}

  .warnbox{background:var(--warnbg);border:1px solid #e9b8b1;border-left:4px solid var(--warn);
    border-radius:7px;padding:10px 13px;margin:8px 0;}
  .warnbox .h{font-weight:800;color:#8c2b21;font-size:13.5px;margin:0 0 3px;}
  .warnbox p{margin:0;font-size:13px;color:#6d2f28;}

  /* ── 대시보드 ─────────────────────────── */
  .dash{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .dash .dh{background:var(--brand);color:#fff;padding:11px 15px;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap;}
  .dash .dh b{font-size:15px;}
  .dash .dh span{font-size:12px;opacity:.88;}
  .dash .db{padding:14px;background:#fafbfc;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:10px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 13px;}
  .kpi .lab{font-size:11.5px;color:var(--sub);font-weight:700;line-height:1.4;}
  .kpi .val{font-size:25px;font-weight:800;line-height:1.25;margin:4px 0 1px;letter-spacing:-.5px;}
  .kpi .val .u{font-size:13px;font-weight:700;margin-left:2px;color:var(--sub);}
  .kpi .sub{font-size:11.5px;color:var(--sub);}
  .kpi .cmp{margin-top:8px;}
  .kpi .cmp .row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);margin:2px 0;}
  .kpi .cmp .row .nm{flex:0 0 34px;}
  .kpi .cmp .bg{flex:1;height:7px;background:#eef1f4;border-radius:99px;overflow:hidden;}
  .kpi .cmp .bg i{display:block;height:100%;border-radius:99px;}
  .kpi .cmp .bg i.me{background:var(--brand2);}
  .kpi .cmp .bg i.all{background:#b8c4ce;}
  .kpi .src{margin-top:9px;padding-top:7px;border-top:1px dashed var(--line);font-size:10px;color:var(--sub);}
  .kpi.warn{border-color:#e9b8b1;background:var(--warnbg);}
  .kpi .flag{display:inline-block;background:#fdece9;color:#8c2b21;border:1px solid #e9b8b1;
    border-radius:3px;padding:0 5px;font-size:9.5px;font-weight:800;margin-left:4px;}
  .kpi .flag.rse{background:#fff3cd;color:#8a6100;border-color:#f0d264;}
  .kpi .lvl{display:inline-block;background:#eef4f9;color:#2c6fa8;border:1px solid #cfe0ee;
    border-radius:3px;padding:0 5px;font-size:9.5px;font-weight:800;margin-left:4px;}
  .up{color:#c0392b;font-weight:800;} .down{color:#1a5276;font-weight:800;}

  .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:12px 0 0;background:#fff;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px;}
  th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;}
  thead th{background:#f2f5f8;font-weight:700;white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-family:"Consolas","D2Coding",monospace;white-space:nowrap;}

  .mock{display:inline-block;background:#fff3cd;color:#8a6100;border:1px solid #f0d264;border-radius:4px;
    padding:1px 7px;font-size:10px;font-weight:800;margin-left:6px;}

  .ctrl{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:7px;padding:9px 16px;cursor:pointer;min-height:44px;}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}
  button:disabled{opacity:.4;cursor:default;}
  button:hover:not(:disabled){border-color:var(--brand2);}
  .ctrl .hint{margin-left:auto;font-size:12px;color:var(--sub);}
  .note{margin:0;padding:11px 20px;background:#fbfcfd;border-top:1px solid var(--line);
    font-size:12.5px;color:#55606c;}
  .note b{color:var(--brand);}
  noscript .ns{margin:20px;padding:14px;border:1px solid #f0d264;background:#fffbe6;border-radius:8px;}

  @media (max-width:520px){
    .stream{padding:14px 14px 6px;}.ctrl{padding:10px 14px;}header{padding:14px;}.note{padding:10px 14px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="row">
      <h1>생애나침반</h1>
      <span class="tag">페르소나 → 통계표ID → KOSIS API → 대시보드</span>
    </div>
    <p>나침반은 <b>어떤 통계표를 봐야 하는지</b>까지만 찾습니다. 실제 수치는 그 ID로 KOSIS API를 불러 옵니다.</p>
  </header>

  <div class="pipe" id="pipe">
    <div class="p" data-i="0"><b>01 주제·범위</b>생애주기 27개 조사</div>
    <div class="p" data-i="1"><b>02 데이터</b>KOSIS API·보도자료</div>
    <div class="p" data-i="2"><b>03 AI 에이전트</b>GraphRAG 교차검증</div>
    <div class="p" data-i="5"><b>04 시각화</b>대시보드</div>
    <div class="p" data-i="6"><b>05 시연·문서</b>프로토타입</div>
  </div>

  <noscript>
    <div class="ns">이 데모는 자바스크립트로 단계를 진행합니다. 스크립트가 막힌 환경이면
    같은 폴더의 <b>생애나침반_시연목업.html</b>(정적 문서)을 열어 주세요.</div>
  </noscript>

  <div class="stream" id="stream"></div>

  <!-- 결과를 먼저 보여 주고, 마지막에 어떻게 왔는지 되짚습니다. -->
  <div class="gwrap" id="gwrap" hidden>
    <div class="ghead">
      <span class="gt">GraphRAG 경로 되짚기</span>
      <span class="gc" id="gcap">대기 중 — 아직 아무 노드도 활성화되지 않았습니다.</span>
    </div>
    <div class="graph" id="graph"><canvas id="gcanvas"></canvas></div>
  </div>

  <div class="ctrl">
    <button class="primary" id="next">▶ 다음 단계</button>
    <button id="auto">⏩ 자동 재생</button>
    <button id="reset">↺ 처음부터</button>
    <span class="hint" id="hint">0 / 17</span>
  </div>

  <p class="note" id="note"><b>지금 단계</b> · 시작 전입니다. 페르소나를 입력하는 장면부터 시작합니다.</p>
</div>

<script>
(function () {
  "use strict";

  var stream = document.getElementById("stream");
  var btnNext = document.getElementById("next");
  var btnAuto = document.getElementById("auto");
  var btnReset = document.getElementById("reset");
  var hint = document.getElementById("hint");
  var note = document.getElementById("note");
  var pipe = document.getElementById("pipe");

  /* ── 시연 데이터 ───────────────────────────────────────────────────
     조사명·통계표ID·유의사항은 실제 구축 데이터입니다.
     KOSIS 응답 수치는 시연용 예시값이며 화면에 '목업'으로 표시합니다. */

  var RAW_QUERY = "대전 사는 35살 남잔데, 또래들 월급 얼마나 받는지, 집 살 때 빚은 얼마나 지는지 궁금해요";
  var P = { age: 35, sex: "남성", region: "대전광역시", regionCode: "30" };

  /* 대시보드 지표 — tbl 은 전부 실제 KOSIS 통계표ID */
  var KPI = [
    { key: "emp",  lab: "30대 남성 고용률",        val: "88.4", unit: "%",
      me: 88.4, all: 89.1, allLab: "전국 89.1%", better: "low",
      survey: "지역별고용조사", tbl: "DT_1ES3A03_A02S",
      tblNm: "시군구/연령별 취업자 및 고용률 (남자)", region: "시군구" },

    { key: "marry", lab: "남성 평균초혼연령",      val: "33.8", unit: "세",
      me: 33.8, all: 34.0, allLab: "전국 34.0세", better: "n",
      survey: "인구동향조사", tbl: "DT_1B83A05",
      tblNm: "시도별 평균초혼연령", region: "시도" },

    { key: "move", lab: "30대 순이동 (대전)",      val: "-3,412", unit: "명",
      me: 0, all: 0, allLab: "순유출", better: "n", trend: "down",
      survey: "국내인구이동통계", tbl: "DT_1B26001_A04",
      tblNm: "시도/성/연령(5세)별 이동자수", region: "시도" },

    { key: "own",  lab: "30대 주택소유율",          val: "31.2", unit: "%",
      me: 31.2, all: 33.5, allLab: "전국 33.5%", better: "low",
      survey: "주택소유통계", tbl: "DT_1OH0518",
      tblNm: "거주지역/연령대/주택소유물건수별 주택소유자수", region: "시도" },

    { key: "asset", lab: "대전 가구 순자산",        val: "3억 1,204", unit: "만원",
      me: 0, all: 0, allLab: "전국 3억 4,721만원", better: "n",
      survey: "가계금융복지조사", tbl: "DT_1HDAAA01",
      tblNm: "지역별 자산, 부채, 소득 현황", region: "시도", rse: true },

    { key: "solo", lab: "30대 남성 1인가구 비중",   val: "38.6", unit: "%",
      me: 38.6, all: 35.2, allLab: "전국 35.2%", better: "high",
      survey: "인구총조사", tbl: "DT_1PR2002",
      tblNm: "성별/연령별/혼인상태별 1인가구(일반가구)-시군구", region: "시군구" },

    { key: "wage", lab: "30대 임금근로 평균소득", val: "418", unit: "만원",
      me: 0, all: 0, allLab: "월평균 · 전국값", better: "n",
      survey: "일자리행정통계", tbl: "DT_1EP_2010",

    { note:"<b>04 두 번째 답변</b> · 첫 답과 숫자가 크게 다릅니다. <b>되묻지 않았으면 틀린 답을 드릴 뻔했습니다.</b>",

    { note:"<b>04 경로 되짚기</b> · 결과를 본 뒤에 <b>어떻게 여기까지 왔는지</b>를 폅니다. 469개 중 몇 개를 켰는지가 여기서 보입니다.",

          "<tr><td>04 시각화</td><td>대시보드 한 화면 (카드 + 결과표)</td><td>/research · /graph</td></tr>"+
          "<tr><td>05 시연·문서</td><td>웹 프로토타입 + 출처 문서 + 5분 시연</td><td>Vercel 배포본</td></tr>"+
          "</tbody></table></div>"+
          '<p style="font-size:13px;margin:10px 0 0;">나침반은 수치를 들고 있지 않습니다. '+
          "돌려주는 것은 <b>통계표ID와 읽는 법</b>뿐입니다. 그래서 통계가 갱신돼도 다시 시드할 필요가 없습니다.</p>"+
          "</div></div>");
      }}
  ];

  /* ── 진행 제어 ───────────────────────────────────────────────── */

  var i=0,timer=null,playing=false,curPipe=0;

  function paintPipe(){
    var ps=pipe.querySelectorAll(".p");
    for(var k=0;k<ps.length;k++){
      var at=Number(ps[k].getAttribute("data-i"));
      ps[k].className="p"+(i===0?"":at<curPipe?" done":at===curPipe?" on":"");
    }
  }
  function step(){
    if(i>=STEPS.length)return;
    var s=STEPS[i];
    if(s.phase)G.phase(s.phase);
    if(typeof s.pipe==="number")curPipe=s.pipe;
    s.run();
    i++;
    note.innerHTML="<b>지금 단계</b> · "+(s.note||"");
    hint.textContent=i+" / "+STEPS.length;
    btnNext.disabled=i>=STEPS.length;
    paintPipe();
    if(i>=STEPS.length)stop();
  }
  function stop(){playing=false;if(timer){clearTimeout(timer);timer=null;}btnAuto.textContent="⏩ 자동 재생";}
  function tick(){
    if(!playing)return;
    step();
    if(i<STEPS.length)timer=setTimeout(tick,2400);else stop();
  }

  btnNext.addEventListener("click",function(){stop();step();});
  btnAuto.addEventListener("click",function(){
    if(playing){stop();return;}
    playing=true;btnAuto.textContent="⏸ 멈춤";tick();
  });
  btnReset.addEventListener("click",function(){
    stop();stream.innerHTML="";G.reset();i=0;curPipe=0;last=null;
    var gw=document.getElementById("gwrap"); if(gw) gw.hidden=true;
    hint.textContent="0 / "+STEPS.length;btnNext.disabled=false;
    note.innerHTML="<b>지금 단계</b> · 시작 전입니다. 페르소나를 입력하는 장면부터 시작합니다.";
    paintPipe();
  });
  document.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();stop();step();}
  });

  hint.textContent="0 / "+STEPS.length;
  paintPipe();
})();
</script>
